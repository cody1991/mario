<!DOCTYPE html>
<html>
<head>
    <title>Sprite Generator</title>
    <style>
        body { font-family: Arial; padding: 20px; background: #333; color: #fff; }
        canvas { border: 1px solid #fff; margin: 10px; display: block; }
        .sprite-section { margin-bottom: 30px; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Super Mario Sprite Generator</h1>
    <p>右键点击每个画布保存为 PNG 文件</p>
    
    <div class="sprite-section">
        <h2>mario.png (192x32 - 6帧)</h2>
        <canvas id="mario" width="192" height="32"></canvas>
        <button onclick="download('mario')">下载 mario.png</button>
    </div>
    
    <div class="sprite-section">
        <h2>tiles.png (160x32 - 5种瓦片)</h2>
        <canvas id="tiles" width="160" height="32"></canvas>
        <button onclick="download('tiles')">下载 tiles.png</button>
    </div>
    
    <div class="sprite-section">
        <h2>enemies.png (96x32 - 3帧)</h2>
        <canvas id="enemies" width="96" height="32"></canvas>
        <button onclick="download('enemies')">下载 enemies.png</button>
    </div>
    
    <div class="sprite-section">
        <h2>items.png (128x32 - 4帧金币)</h2>
        <canvas id="items" width="128" height="32"></canvas>
        <button onclick="download('items')">下载 items.png</button>
    </div>

    <script>
        // Mario sprite (6 frames: idle, walk1, walk2, walk3, jump, die)
        function drawMario() {
            const canvas = document.getElementById('mario');
            const ctx = canvas.getContext('2d');
            const size = 32;
            
            for (let i = 0; i < 6; i++) {
                const x = i * size;
                
                // Body (red)
                ctx.fillStyle = '#e52521';
                ctx.fillRect(x + 8, 8, 16, 16);
                
                // Head (skin)
                ctx.fillStyle = '#ffa500';
                ctx.fillRect(x + 10, 2, 12, 10);
                
                // Hat (red)
                ctx.fillStyle = '#e52521';
                ctx.fillRect(x + 8, 0, 16, 6);
                
                // Eyes
                ctx.fillStyle = '#000';
                ctx.fillRect(x + 18, 4, 2, 2);
                
                // Legs (blue)
                ctx.fillStyle = '#0000ff';
                
                if (i === 0) {
                    // Idle
                    ctx.fillRect(x + 10, 24, 5, 8);
                    ctx.fillRect(x + 17, 24, 5, 8);
                } else if (i >= 1 && i <= 3) {
                    // Walking animation
                    const offset = (i - 1) * 2;
                    ctx.fillRect(x + 8 + offset, 24, 5, 8);
                    ctx.fillRect(x + 19 - offset, 24, 5, 8);
                } else if (i === 4) {
                    // Jump
                    ctx.fillRect(x + 8, 22, 5, 10);
                    ctx.fillRect(x + 19, 22, 5, 10);
                } else {
                    // Die (upside down effect)
                    ctx.fillRect(x + 10, 24, 12, 6);
                }
            }
        }
        
        // Tiles sprite (5 types: ground, brick, question, pipe, goal)
        function drawTiles() {
            const canvas = document.getElementById('tiles');
            const ctx = canvas.getContext('2d');
            const size = 32;
            
            // Ground
            ctx.fillStyle = '#8B4513';
            ctx.fillRect(0, 0, size, size);
            ctx.fillStyle = '#228B22';
            ctx.fillRect(0, 0, size, 8);
            
            // Brick
            ctx.fillStyle = '#CD853F';
            ctx.fillRect(size, 0, size, size);
            ctx.strokeStyle = '#8B4513';
            ctx.lineWidth = 2;
            ctx.strokeRect(size + 2, 2, 12, 12);
            ctx.strokeRect(size + 18, 2, 12, 12);
            ctx.strokeRect(size + 10, 16, 12, 12);
            
            // Question block
            ctx.fillStyle = '#FFD700';
            ctx.fillRect(size * 2, 0, size, size);
            ctx.fillStyle = '#000';
            ctx.font = '20px Arial';
            ctx.fillText('?', size * 2 + 10, 24);
            
            // Pipe top
            ctx.fillStyle = '#228B22';
            ctx.fillRect(size * 3, 0, size, size);
            ctx.fillStyle = '#32CD32';
            ctx.fillRect(size * 3 + 4, 4, 24, 24);
            
            // Goal flag
            ctx.fillStyle = '#808080';
            ctx.fillRect(size * 4 + 14, 0, 4, size);
            ctx.fillStyle = '#00FF00';
            ctx.beginPath();
            ctx.moveTo(size * 4 + 18, 4);
            ctx.lineTo(size * 4 + 30, 10);
            ctx.lineTo(size * 4 + 18, 16);
            ctx.fill();
        }
        
        // Enemies sprite (3 frames: walk1, walk2, squished)
        function drawEnemies() {
            const canvas = document.getElementById('enemies');
            const ctx = canvas.getContext('2d');
            const size = 32;
            
            for (let i = 0; i < 3; i++) {
                const x = i * size;
                
                if (i < 2) {
                    // Goomba walking
                    ctx.fillStyle = '#8B4513';
                    ctx.beginPath();
                    ctx.arc(x + 16, 16, 12, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // Eyes
                    ctx.fillStyle = '#fff';
                    ctx.fillRect(x + 8, 10, 6, 6);
                    ctx.fillRect(x + 18, 10, 6, 6);
                    ctx.fillStyle = '#000';
                    ctx.fillRect(x + 10, 12, 3, 3);
                    ctx.fillRect(x + 20, 12, 3, 3);
                    
                    // Feet
                    ctx.fillStyle = '#000';
                    const footOffset = i * 4;
                    ctx.fillRect(x + 6 + footOffset, 26, 8, 6);
                    ctx.fillRect(x + 18 - footOffset, 26, 8, 6);
                } else {
                    // Squished
                    ctx.fillStyle = '#8B4513';
                    ctx.fillRect(x + 4, 24, 24, 8);
                    ctx.fillStyle = '#000';
                    ctx.fillRect(x + 8, 26, 4, 2);
                    ctx.fillRect(x + 20, 26, 4, 2);
                }
            }
        }
        
        // Items sprite (4 frames: coin animation)
        function drawItems() {
            const canvas = document.getElementById('items');
            const ctx = canvas.getContext('2d');
            const size = 32;
            
            const widths = [24, 16, 8, 16];
            
            for (let i = 0; i < 4; i++) {
                const x = i * size;
                const w = widths[i];
                const offset = (size - w) / 2;
                
                // Coin
                ctx.fillStyle = '#FFD700';
                ctx.beginPath();
                ctx.ellipse(x + 16, 16, w / 2, 12, 0, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.fillStyle = '#FFA500';
                ctx.beginPath();
                ctx.ellipse(x + 16, 16, w / 2 - 2, 10, 0, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        
        // Download function
        function download(id) {
            const canvas = document.getElementById(id);
            const link = document.createElement('a');
            link.download = id + '.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }
        
        // Draw all sprites
        drawMario();
        drawTiles();
        drawEnemies();
        drawItems();
    </script>
</body>
</html>
